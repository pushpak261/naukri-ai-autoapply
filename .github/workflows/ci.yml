name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # --- Hardening gate: must be green ---
      - name: Lint (hardening code)
        run: ruff check libs tests/test_resilience.py tests/test_security.py tests/test_auth_verify.py tests/test_config_secret.py tests/test_apply_claim.py tests/test_block_detector.py

      - name: Format check (hardening code)
        run: black --check libs

      - name: Run hardening tests
        run: pytest tests/test_resilience.py tests/test_security.py tests/test_auth_verify.py tests/test_config_secret.py tests/test_apply_claim.py tests/test_block_detector.py -q

      # --- Full-repo checks (informational; the pre-existing codebase has
      #     lint/test debt that is tracked separately from the hardening work) ---
      - name: Lint (full repo, informational)
        run: ruff check .
        continue-on-error: true

      - name: Type check (mypy, src)
        run: mypy src/
        continue-on-error: true

      - name: Run full test suite
        run: pytest -q

  browser-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify offline browser forms and submission safety
        run: pytest tests/test_offline_workflows.py tests/test_linkedin_modern_search.py tests/test_linkedin_screening_flow.py tests/test_linkedin_search_recovery.py tests/test_linkedin_runtime_recovery.py tests/test_screening_intelligence_browser.py tests/test_apply_flow_audit.py tests/test_naukri_production_flow.py tests/test_offline_screening_completion.py tests/test_naukri_search_loading.py tests/test_naukri_chatbot_reliability.py tests/test_naukri_pagination_boundaries.py tests/test_external_applications.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build && node tests/api.test.mjs
        working-directory: frontend
