name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # --- Hardening gate: must be green ---
      - name: Lint (hardening code)
        run: ruff check libs tests/test_resilience.py tests/test_security.py tests/test_auth_verify.py tests/test_config_secret.py tests/test_apply_claim.py tests/test_block_detector.py

      - name: Format check (hardening code)
        run: black --check libs

      - name: Run hardening tests
        run: pytest tests/test_resilience.py tests/test_security.py tests/test_auth_verify.py tests/test_config_secret.py tests/test_apply_claim.py tests/test_block_detector.py -q

      # --- Full-repo checks (informational; the pre-existing codebase has
      #     lint/test debt that is tracked separately from the hardening work) ---
      - name: Lint (full repo, informational)
        run: ruff check .
        continue-on-error: true

      - name: Type check (mypy, src)
        run: mypy src/
        continue-on-error: true

      - name: Run full test suite (informational)
        run: pytest -q
        continue-on-error: true
