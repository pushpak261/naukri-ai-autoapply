name: OpenCode Production Health

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs during peak load.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: opencode-production-health
  cancel-in-progress: false

permissions:
  # Dispatch the OpenCode workflow after a failed health check.
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check the production health endpoint
        id: health
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "PRODUCTION_HEALTH_URL is not configured."
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables."
            echo "healthy=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if curl -fsS --retry 2 --retry-delay 5 --max-time 20 "$HEALTH_URL" >/tmp/health.json; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "Production health check passed."
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "Production health check failed."
            head -c 2000 /tmp/health.json 2>/dev/null || true
          fi

      - name: Dispatch OpenCode after a new outage
        if: steps.health.outputs.healthy == 'false'
        uses: actions/github-script@v7
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Do not dispatch again while the previous health run is still
            // failing. One OpenCode attempt per outage is enough.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'opencode-production-health.yml',
              per_page: 10,
            });
            const previous = runs.data.workflow_runs.find((run) => run.id !== context.runId);
            if (previous && previous.conclusion === 'failure') {
              core.notice('The previous production health run already failed; skipping duplicate dispatch.');
              return;
            }

            const prompt = [
              'The production health check failed. Investigate whether a code change caused the outage.',
              '',
              `Repository: ${owner}/${repo}`,
              `Health URL: ${process.env.HEALTH_URL}`,
              `Commit: ${context.sha}`,
              `Health run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              'Instructions:',
              '1. Check the health endpoint, the API/gateway startup path, and the most recent commits.',
              '2. If a code change can fix the outage, make the smallest safe fix, run the relevant tests, and open a pull request.',
              '3. If the failure is infrastructure, credentials, a platform outage, or an external service, do not change code. Explain the finding in a pull request or comment instead.',
              '4. Do not change secrets, credentials, deployment configuration, or health-check thresholds.',
              '5. Do not disable or weaken health checks.',
            ].join('\n');

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'opencode.yml',
              ref: 'main',
              inputs: { prompt },
            });

            await core.summary
              .addHeading('Production health check failed')
              .addRaw(`\nOpenCode was dispatched to investigate.\n\nHealth URL: ${process.env.HEALTH_URL}\n`)
              .write();

      - name: Record the failed check
        if: steps.health.outputs.healthy == 'false'
        run: |
          echo "The production health check failed; OpenCode was dispatched if this is a new outage."
          exit 1
