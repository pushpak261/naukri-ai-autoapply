name: OpenCode CI Autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: opencode-ci-autofix-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  # Required to dispatch the OpenCode workflow. The dispatched run gets its own
  # token, so this workflow never has write access to the repository itself.
  actions: write

jobs:
  dispatch-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dispatch OpenCode with the CI failure context
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: run.id, per_page: 100 }
            );

            const failedJobs = jobs
              .filter((job) => job.conclusion === 'failure')
              .slice(0, 20)
              .map((job) => {
                const failedSteps = (job.steps || [])
                  .filter((step) => step.conclusion === 'failure')
                  .map((step) => step.name)
                  .join(', ');
                return `- ${job.name}${failedSteps ? ` (failed steps: ${failedSteps})` : ''}`;
              })
              .join('\n');

            const commitMessage = (run.head_commit?.message || 'unknown').slice(0, 500);

            const prompt = [
              'CI failed on the main branch. Investigate the root cause and fix it.',
              '',
              `Repository: ${owner}/${repo}`,
              `Branch: ${run.head_branch}`,
              `Commit: ${run.head_sha}`,
              `Commit message: ${commitMessage}`,
              `Workflow run: ${run.html_url}`,
              '',
              'Failed jobs:',
              failedJobs || '- (job details unavailable)',
              '',
              'Instructions:',
              '1. Reproduce the failure locally by running the failing tests or commands.',
              '2. Make the smallest safe change that fixes the root cause.',
              '3. Do not disable, skip, or weaken tests, lint rules, or CI checks.',
              '4. Do not change secrets, credentials, or deployment configuration.',
              '5. Run the relevant test suite after the fix.',
              '6. Commit the fix to a new branch and open a pull request that explains the root cause and the verification you ran.',
              '7. If the failure is caused by missing credentials, an external service outage, or is clearly flaky, do not change code. Explain the finding in a pull request or comment instead.',
            ].join('\n');

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'opencode.yml',
              ref: 'main',
              inputs: { prompt },
            });

            await core.summary
              .addHeading('OpenCode autofix dispatched')
              .addLink('Failed CI run', run.html_url)
              .addRaw(`\n\nFailed jobs:\n${failedJobs || 'unknown'}\n`)
              .write();
