# SonarCloud organization and project keys
sonar.organization=pushpak261
sonar.projectKey=pushpak261_naukri-ai-autoapply
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=Naukri AI Auto Apply Agent
sonar.projectVersion=1.0

# Comma-separated paths to directories with sources
sonar.sources=src,api,libs,services
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Comma-separated paths to directories with tests
sonar.tests=tests

# Test execution and coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclude runtime artifacts, data, static config, and scripts from analysis
sonar.exclusions=**/__init__.py, **/*_test.py, tests/**, scripts/**, **/*.md, **/*.json, **/*.yaml, **/*.txt, data/**, debug_artifacts/**, terminal_output/**, frontend/**

# Coverage exclusions: Live browser automation, UI pages, entry points, and migrations
sonar.coverage.exclusions=**/browser/**, **/pages/**, **/stealth.py, **/interactions.py, **/main.py, src/linked_agent/**, api/**, services/**, migrations/**, libs/**, scripts/**, tests/**, **/terminal_logging.py, **/project_indexer.py

# Duplication (CPD) exclusions across agents and models
sonar.cpd.exclusions=src/linked_agent/**, **/browser/**, **/models/**, api/**, services/**
